<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>釜山小旅行 11/6–11/10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --ink-soft:#7a7472;
  --coral:#F2A497; --yellow:#F6D27A; --aqua:#A8D3E6; --green:#B9DAA5;
  --line:3px solid var(--ink);
  --r-lg:28px; --r-md:20px; --r-sm:12px;
  --nav-h:58px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px) + 12px)}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Huninn","jf-openhuninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px;border-radius:10px}

/* ---------- 固定選單 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
.nav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--paper);border-bottom:var(--line);
}
.nav-inner{
  max-width:720px;margin:0 auto;height:var(--nav-h);
  display:flex;align-items:center;gap:6px;padding:0 10px;
  overflow-x:auto;scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none}
.nav a{
  flex:0 0 auto;text-decoration:none;font-size:15px;
  padding:6px 13px;border:var(--line);border-radius:999px;background:#fff;
  transition:transform .15s;
}
.nav a.on{background:var(--yellow)}
.nav a:active{transform:translateY(2px)}
.nav .brand{border:none;background:none;padding:6px 4px;font-size:17px;margin-right:2px}

main{max-width:720px;margin:0 auto;padding:0 16px 40px}
section{margin-top:34px}
h2{
  font-size:22px;font-weight:400;margin:0 0 14px;
  display:flex;align-items:center;gap:10px;
}
h2 .dot{width:18px;height:18px;border:var(--line);border-radius:50%;flex:0 0 auto}

.box{background:#fff;border:var(--line);border-radius:var(--r-lg)}

/* ---------- 首頁 ---------- */
.hero{margin-top:16px;overflow:hidden;background:var(--paper)}
.hero svg{display:block;width:100%;height:auto}
.hero-text{padding:6px 20px 20px;border-top:var(--line);background:#fff}
.hero h1{font-size:34px;font-weight:400;line-height:1.25;margin:12px 0 2px}
.hero .sub{margin:0;color:var(--ink-soft);font-size:15px}
.count{display:flex;gap:8px;margin-top:16px;align-items:stretch}
.count .cell{
  flex:1;text-align:center;border:var(--line);border-radius:var(--r-md);padding:8px 4px 6px;
}
.count .cell:nth-child(1){background:var(--coral)}
.count .cell:nth-child(2){background:var(--yellow)}
.count .cell:nth-child(3){background:var(--aqua)}
.count b{display:block;font-size:30px;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.count small{font-size:13px}
.count-msg{margin:10px 0 0;font-size:14px;color:var(--ink-soft)}

/* 插圖動畫 */
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes pop{0%,100%{transform:scale(.82);opacity:.75}50%{transform:scale(1);opacity:1}}
@keyframes ride{0%,8%{transform:translateX(0)}46%,54%{transform:translateX(118px)}92%,100%{transform:translateX(0)}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
.a-drift{animation:drift 7s ease-in-out infinite alternate}
.a-drift.slow{animation-duration:10s}
.a-bob{animation:bob 3.2s ease-in-out infinite}
.a-wave{animation:wave 4s linear infinite}
.a-wave.b{animation-duration:6s;animation-direction:reverse}
.a-pop{transform-box:fill-box;transform-origin:center;animation:pop 2.6s ease-in-out infinite}
.a-pop.d1{animation-delay:-.9s}.a-pop.d2{animation-delay:-1.7s}
.a-ride{animation:ride 16s ease-in-out infinite}
.a-flap{transform-box:fill-box;transform-origin:center;animation:flap .9s ease-in-out infinite}

/* ---------- 航班 ---------- */
.flights{display:grid;gap:14px}
.ticket{position:relative;padding:16px 18px;overflow:hidden}
.ticket::before,.ticket::after{
  content:"";position:absolute;top:50%;width:24px;height:24px;margin-top:-12px;
  background:var(--paper);border:var(--line);border-radius:50%;
}
.ticket::before{left:-14px}.ticket::after{right:-14px}
.ticket .head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.chip{display:inline-block;padding:2px 10px;border:var(--line);border-radius:999px;font-size:13px;line-height:1.5;background:#fff}
.ticket.go .chip.kind{background:var(--coral)}
.ticket.back .chip.kind{background:var(--aqua)}
.route{display:flex;align-items:center;gap:10px;margin:12px 0 4px}
.route .pt{flex:0 0 auto;min-width:86px}
.route .pt:last-child{text-align:right}
.route .t{font-size:28px;line-height:1.1}
.route .c{font-size:14px;color:var(--ink-soft)}
.route .mid{flex:1;border-top:3px dashed var(--ink);position:relative;height:0}
.route .mid svg{position:absolute;left:50%;top:-15px;margin-left:-15px}
.ticket .foot{font-size:13px;color:var(--ink-soft);border-top:3px dotted #d9d2c8;padding-top:8px;margin-top:10px}

/* ---------- 每日行程 ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;min-width:68px;border:var(--line);border-radius:var(--r-md);
  background:#fff;padding:7px 10px 6px;text-align:center;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .12s,box-shadow .12s;
}
.tab b{display:block;font-weight:400;font-size:19px;line-height:1.2}
.tab small{font-size:12.5px}
.tab[aria-selected="true"]{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.tab:nth-child(5n+1)[aria-selected="true"]{background:var(--coral)}
.tab:nth-child(5n+2)[aria-selected="true"]{background:var(--yellow)}
.tab:nth-child(5n+3)[aria-selected="true"]{background:var(--aqua)}
.tab:nth-child(5n+4)[aria-selected="true"]{background:var(--green)}
.tab:nth-child(5n+5)[aria-selected="true"]{background:var(--coral)}

.dayhead{display:flex;align-items:center;gap:14px;padding:14px 16px;margin:6px 0 18px}
.dayhead svg{flex:0 0 auto}
.dayhead h3{margin:0;font-weight:400;font-size:21px;line-height:1.3}
.dayhead p{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}

.plans{display:flex;gap:8px;margin:-6px 0 16px;flex-wrap:wrap}
.plan{border:var(--line);border-radius:999px;background:#fff;padding:4px 14px;cursor:pointer;font-size:15px}
.plan[aria-pressed="true"]{background:var(--green)}
.plan-note{width:100%;font-size:13px;color:var(--ink-soft);margin:2px 2px 0}

.timeline{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.timeline::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.stop{position:relative;margin-bottom:14px}
.stop::before{
  content:"";position:absolute;left:-21px;top:16px;width:18px;height:18px;
  border:var(--line);border-radius:50%;background:var(--paper);
}
.stop.must::before{background:var(--coral)}
.card{padding:12px 14px 12px;border-radius:var(--r-md)}
.card .top{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.time{font-size:14px;padding:1px 9px;border:var(--line);border-radius:999px;background:var(--paper);white-space:nowrap}
.card h4{margin:6px 0 0;font-weight:400;font-size:18px;line-height:1.4;width:100%}
.card p{margin:3px 0 0;font-size:14px;color:var(--ink-soft)}
.must-stamp{
  margin-left:auto;font-size:13px;padding:0 8px;border:var(--line);border-radius:8px;
  background:var(--coral);transform:rotate(-6deg);line-height:1.6;
}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{font-size:13.5px;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:#fff}
.opt.ok{background:var(--green)}
.opt.no{text-decoration:line-through;color:var(--ink-soft)}
.opt.map{text-decoration:none;display:inline-flex;align-items:center;gap:4px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.opt.map:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.opt.map.no{text-decoration:line-through}
.maplink{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:13.5px;text-decoration:none;padding:3px 12px 3px 9px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.maplink:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.tags + .maplink{margin-left:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12.5px;padding:1px 9px 1px 7px;border:2px solid var(--ink);border-radius:999px;display:inline-flex;align-items:center;gap:4px}
.tag i{font-style:normal}
.tag.plane{background:var(--coral)}
.tag.metro{background:var(--aqua)}
.tag.taxi{background:var(--yellow)}
.tag.walk{background:var(--green)}
.tag.train{background:var(--aqua)}
.tag.deliver{background:#fff}

@keyframes boing{
  0%{transform:translateY(16px) scale(.97);opacity:0}
  45%{transform:translateY(-8px) scale(1.01);opacity:1}
  70%{transform:translateY(3px)}
  100%{transform:translateY(0) scale(1)}
}
.boing{animation:boing .55s cubic-bezier(.3,1.4,.5,1) both}
.boing .stop{animation:boing .55s cubic-bezier(.3,1.4,.5,1) both}

.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--ink-soft);align-items:center}

/* ---------- 待辦 ---------- */
.todo{padding:8px 14px 14px}
.progress{display:flex;align-items:center;gap:10px;padding:8px 2px 10px;font-size:14px}
.bar{flex:1;height:16px;border:var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.bar span{display:block;height:100%;width:0;background:var(--green);border-right:3px solid var(--ink);transition:width .35s cubic-bezier(.3,1.4,.5,1)}
.todo ul{list-style:none;margin:0;padding:0}
.todo li+li{border-top:2px dashed #e4ddd2}
.todo label{display:flex;gap:12px;align-items:flex-start;padding:10px 2px;cursor:pointer}
.todo input{position:absolute;opacity:0;width:1px;height:1px}
.check{
  flex:0 0 auto;width:26px;height:26px;border:var(--line);border-radius:9px;background:#fff;
  display:grid;place-items:center;margin-top:1px;transition:background .15s,transform .15s;
}
.check svg{opacity:0;transform:scale(.4);transition:opacity .15s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.todo input:checked + .check{background:var(--yellow)}
.todo input:checked + .check svg{opacity:1;transform:scale(1)}
.todo input:focus-visible + .check{outline:3px dashed var(--ink);outline-offset:3px}
.todo .txt small{display:block;font-size:13px;color:var(--ink-soft)}
.todo input:checked ~ .txt{color:var(--ink-soft);text-decoration:line-through}

/* ---------- 住宿 ---------- */
.stays{display:grid;gap:14px}
.gsel{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:14px}
.gsel-lab{font-size:14px;color:var(--ink-soft);margin-right:2px}
.gbtn{border:var(--line);border-radius:999px;background:#fff;padding:3px 14px;cursor:pointer;font-size:15px;box-shadow:0 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.gbtn[aria-pressed="true"]{background:var(--yellow);transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.gbadge{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:0 9px;border:2px solid var(--ink);border-radius:8px;background:#fff;line-height:1.7}
.gbadge::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--ink)}
.gbadge.g1::before{background:var(--coral)}
.gbadge.g2::before{background:var(--green)}
.fgroup+.fgroup{margin-top:18px}
.fgroup h3{margin:0 0 10px;font-weight:400}
.fgroup h3 .gbadge{font-size:15px}
.empty{padding:18px 16px;font-size:15px;text-align:center;border-radius:var(--r-md);color:var(--ink-soft)}
.stay{display:flex;gap:14px;padding:14px 16px;align-items:center}
.stay svg{flex:0 0 auto}
.stay h3{margin:0;font-weight:400;font-size:19px}
.stay p{margin:2px 0 0;font-size:14px;color:var(--ink-soft)}
.stay .nights{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.stay .nights .chip{font-size:12.5px}

.notes{display:grid;gap:12px}
.note{padding:14px 16px;border-radius:var(--r-md)}
.note h3{margin:0;font-weight:400;font-size:18px;display:flex;gap:8px;align-items:center}
.note p{margin:4px 0 0;font-size:14.5px}
.note small{display:block;margin-top:6px;font-size:13px;color:var(--ink-soft)}
.note-img{display:block;width:100%;margin-top:10px;padding:0;border:var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--paper);cursor:zoom-in}
.note-img img{display:block;width:100%;height:auto}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(255,252,246,.96);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 50px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
.lightbox[hidden]{display:none}
.lightbox img{max-width:100%;max-height:100%;border:var(--line);border-radius:var(--r-md);background:#fff}
.lb-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:14px;width:40px;height:40px;border:var(--line);border-radius:50%;background:var(--yellow);font-size:18px;cursor:pointer}
@media (min-width:640px){.notes{grid-template-columns:1fr 1fr}}
footer{text-align:center;font-size:13px;color:var(--ink-soft);padding:10px 0 30px}

@media (min-width:640px){
  .flights,.stays{grid-template-columns:1fr 1fr}
  .hero h1{font-size:40px}
}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<nav class="nav" aria-label="主選單">
  <div class="nav-inner">
    <a class="brand" href="#home">釜山小旅行</a>
    <a href="#home" data-sec="home">首頁</a>
    <a href="#flight" data-sec="flight">航班</a>
    <a href="#days" data-sec="days">行程</a>
    <a href="#todo" data-sec="todo">待辦</a>
    <a href="#stay" data-sec="stay">住宿</a>
    <a href="#notes" data-sec="notes">注意事項</a>
  </div>
</nav>

<main>
<!-- ===== 首頁 ===== -->
<section id="home" class="hero box" style="margin-top:16px">
  <svg viewBox="0 0 360 250" role="img" aria-label="釜山插圖：廣安大橋上的煙火、甘川洞彩色小屋、釜山塔與海雲台天空膠囊列車">
    <defs>
      <clipPath id="sea"><rect x="0" y="150" width="360" height="100"/></clipPath>
    </defs>
    <!-- 太陽 -->
    <g class="a-bob"><circle cx="300" cy="44" r="22" fill="#F6D27A" stroke="#3E3A39" stroke-width="3"/></g>
    <!-- 雲 -->
    <g class="a-drift">
      <path d="M40 52 q0-14 15-14 q5-10 17-6 q10-4 15 6 q12 0 12 14 z" fill="#fff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g class="a-drift slow">
      <path d="M214 76 q0-10 11-10 q4-8 13-5 q8-3 12 5 q9 0 9 10 z" fill="#fff" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- 煙火 -->
    <g class="a-pop" stroke="#3E3A39" stroke-width="3" stroke-linecap="round">
      <circle cx="150" cy="46" r="6" fill="#F2A497"/>
      <path d="M150 30v-8M150 62v8M134 46h-8M166 46h8M139 35l-6-6M161 35l6-6M139 57l-6 6M161 57l6 6" fill="none"/>
    </g>
    <g class="a-pop d1" stroke="#3E3A39" stroke-width="3" stroke-linecap="round">
      <circle cx="196" cy="30" r="4.5" fill="#A8D3E6"/>
      <path d="M196 19v-6M196 41v6M185 30h-6M207 30h6M188 22l-4-4M204 22l4-4M188 38l-4 4M204 38l4 4" fill="none"/>
    </g>
    <g class="a-pop d2" stroke="#3E3A39" stroke-width="3" stroke-linecap="round">
      <circle cx="248" cy="58" r="4" fill="#B9DAA5"/>
      <path d="M248 48v-5M248 68v5M238 58h-5M258 58h5" fill="none"/>
    </g>
    <!-- 海鷗 -->
    <g class="a-drift slow"><g class="a-flap">
      <path d="M92 86 q6-7 12 0 q6-7 12 0" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g>

    <!-- 山與甘川洞小屋 -->
    <path d="M-4 152 Q30 92 74 98 Q112 104 128 152 Z" fill="#B9DAA5" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round">
      <rect x="22" y="128" width="16" height="14" fill="#F2A497"/><path d="M20 128l10-8 10 8z" fill="#A8D3E6"/>
      <rect x="44" y="120" width="15" height="13" fill="#F6D27A"/><path d="M42 120l9.5-7 9.5 7z" fill="#F2A497"/>
      <rect x="66" y="126" width="16" height="14" fill="#A8D3E6"/><path d="M64 126l10-8 10 8z" fill="#F6D27A"/>
      <rect x="88" y="134" width="15" height="12" fill="#fff"/><path d="M86 134l9.5-7 9.5 7z" fill="#B9DAA5"/>
      <rect x="36" y="140" width="14" height="10" fill="#fff"/>
    </g>
    <!-- 釜山塔 -->
    <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
      <path d="M62 112 L64 70 L68 70 L70 112" fill="#fff"/>
      <rect x="57" y="62" width="18" height="10" rx="4" fill="#F2A497"/>
      <path d="M66 62v-12"/>
    </g>

    <!-- 廣安大橋 -->
    <g stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M120 150 H360"/>
      <path d="M188 150 V96 M200 150 V96 M278 150 V96 M290 150 V96"/>
      <path d="M186 96 H202 M276 96 H292"/>
      <path d="M124 150 Q160 128 194 98 Q239 140 284 98 Q318 130 360 140"/>
      <path d="M150 150v-12 M170 150v-26 M215 150v-28 M239 150v-16 M263 150v-28 M310 150v-22 M334 150v-14" stroke-width="2"/>
    </g>
    <path d="M120 150 H360 V156 H120 Z" fill="#F6D27A" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>

    <!-- 海 -->
    <rect x="0" y="152" width="360" height="98" fill="#A8D3E6"/>
    <g clip-path="url(#sea)" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round">
      <path class="a-wave" d="M0 178 q10-7 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
      <path class="a-wave b" d="M-40 198 q10-6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" stroke-width="2.5"/>
    </g>
    <line x1="0" y1="152" x2="120" y2="152" stroke="#3E3A39" stroke-width="3"/>

    <!-- 海岸與天空膠囊列車 -->
    <path d="M-4 250 L-4 214 Q90 204 180 214 T364 212 L364 250 Z" fill="#FFFCF6" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round"/>
    <path d="M10 220 H300" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 220v12 M90 220v12 M150 220v12 M210 220v12 M270 220v12" stroke="#3E3A39" stroke-width="3" stroke-linecap="round"/>
    <g class="a-ride">
      <g class="a-bob">
        <g stroke="#3E3A39" stroke-width="3" stroke-linejoin="round">

  plane:`<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#F2A497" ${S}/><path d="M12 31l30-12c3-1 5 2 2 4L18 36z" fill="#fff" ${S}/><path d="M24 27l-5-8 4-1 9 6M24 33l2 7 3-1 2-7" fill="#fff" ${S}/></svg>`,
  fire:`<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#F6D27A" ${S}/><circle cx="28" cy="26" r="5" fill="#F2A497" ${S}/><path d="M28 14v-4M28 38v4M16 26h-4M40 26h4M19 17l-3-3M37 17l3-3M19 35l-3 3M37 35l3 3" fill="none" ${S}/></svg>`,
  fish:`<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#A8D3E6" ${S}/><path d="M12 28c6-9 18-10 26 0-8 10-20 9-26 0z" fill="#F2A497" ${S}/><path d="M38 28l7-6v12z" fill="#F2A497" ${S}/><circle cx="20" cy="26" r="1.8" fill="#3E3A39"/></svg>`,
  capsule:`<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#B9DAA5" ${S}/><path d="M8 38h40" fill="none" ${S}/><rect x="11" y="20" width="16" height="16" rx="6" fill="#F6D27A" ${S}/><rect x="29" y="20" width="16" height="16" rx="6" fill="#F2A497" ${S}/><rect x="14" y="23" width="10" height="6" rx="2" fill="#fff" stroke="#3E3A39" stroke-width="2"/><rect x="32" y="23" width="10" height="6" rx="2" fill="#fff" stroke="#3E3A39" stroke-width="2"/></svg>`,
  bag:`<svg width="56" height="56" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="25" fill="#F2A497" ${S}/><rect x="16" y="20" width="24" height="20" rx="5" fill="#fff" ${S}/><path d="M23 20v-4h10v4M22 26v8M34 26v8" fill="none" ${S}/></svg>`,
  house:(c)=>`<svg width="54" height="54" viewBox="0 0 54 54" aria-hidden="true"><path d="M8 26L27 10l19 16" fill="none" ${S}/><path d="M12 24v20h30V24L27 12z" fill="${c}" ${S}/><rect x="22" y="31" width="10" height="13" rx="2" fill="#fff" ${S}/></svg>`,
  tinyPlane:`<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#FFFCF6" ${S}/><path d="M7 16l15-6c2-.6 3 1 1 2L10 19z" fill="#F6D27A" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/></svg>`,
  tick:`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};

/* ====== 渲染 ====== */
const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderFlights(){
  const gs = curGroup==="all" ? ["g1","g2"] : [curGroup];
  $("#flights").innerHTML = gs.map(g=>`
    <div class="fgroup"><h3><span class="gbadge ${g}">${GROUPS[g].name}</span></h3>
    <div class="flights">${FLIGHTS.filter(f=>f.g===g).map(f=>`
    <article class="ticket box ${f.cls}">
      <div class="head"><span class="chip kind">${f.kind}</span><span>${f.date}</span><span class="chip">${esc(f.no)}</span></div>
      <div class="route">
        <div class="pt"><div class="t">${f.from.t}</div><div class="c">${f.from.c}</div></div>
        <div class="mid">${ICONS.tinyPlane}</div>
        <div class="pt"><div class="t">${f.to.t}</div><div class="c">${f.to.c}</div></div>
      </div>
      <div class="foot">${esc(f.foot)}</div>
    </article>`).join("")}</div></div>`).join("");
}

const PIN = `<svg width="13" height="15" viewBox="0 0 13 15" aria-hidden="true"><path d="M6.5 13.5S1.5 8.6 1.5 5.6a5 5 0 0 1 10 0c0 3-5 7.9-5 7.9z" fill="#F2A497" stroke="#3E3A39" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="5.6" r="1.6" fill="#fff" stroke="#3E3A39" stroke-width="1.5"/></svg>`;
let curDay = 1, curPlan = "A", curGroup = "all";
const inGroup = (s)=> !s.g || curGroup==="all" || s.g===curGroup;

function stopHTML(s){
  const opts = s.opts ? `<div class="opts">${s.opts.map(([o,st,q])=> q
      ? `<a class="opt map ${st||""}" href="${NAVER(q)}" target="_blank" rel="noopener" aria-label="${esc(o)}（在 Naver 地圖開啟）">${PIN}${esc(o)}</a>`
      : `<span class="opt ${st||""}">${esc(o)}</span>`).join("")}</div>` : "";
  const tags = s.tags ? `<div class="tags">${s.tags.map(k=>`<span class="tag ${k}">${TAGS[k]}</span>`).join("")}</div>` : "";
  const map = s.q ? `<a class="maplink" href="${NAVER(s.q)}" target="_blank" rel="noopener">${PIN}Naver 地圖</a>` : "";
  return `<li class="stop${s.must?" must":""}"><div class="card box">
    <div class="top"><span class="time">${esc(s.t)}</span>${s.g?`<span class="gbadge ${s.g}">${GROUPS[s.g].name}</span>`:""}${s.must?'<span class="must-stamp">必去</span>':""}
    <h4>${esc(s.h)}</h4></div>
    ${s.p?`<p>${esc(s.p)}</p>`:""}${opts}${tags}${map}</div></li>`;
}

function renderTabs(){
  $("#tabs").innerHTML = DAYS.map((d,i)=>`
    <button class="tab" role="tab" id="tab${i}" aria-controls="daypanel" aria-selected="${i===curDay}" tabindex="${i===curDay?0:-1}" data-i="${i}">
      <b>${d.d}</b><small>週${d.w}${d.only?"・"+GROUPS[d.only].name:""}</small>
    </button>`).join("");
}

function renderDay(animate){
  const d = DAYS[curDay];
  let stops = d.stops, plans = "";
  if (d.plans){
    stops = d.plans[curPlan].stops;
    plans = `<div class="plans" role="group" aria-label="選擇方案">${Object.keys(d.plans).map(k=>
      `<button class="plan" data-plan="${k}" aria-pressed="${k===curPlan}">方案 ${k}</button>`).join("")}
      <p class="plan-note">${esc(d.plans[curPlan].note)}</p></div>`;
  }
  stops = stops.filter(inGroup);
  const panel = $("#daypanel");
  panel.setAttribute("aria-labelledby","tab"+curDay);
  panel.innerHTML = `
    <div class="dayhead box">${ICONS[d.icon]}<div><h3>${esc(d.title)}</h3><p>${d.d}（${d.w}）・${esc(d.area)}</p></div></div>
    ${plans}
    ${stops.length ? `<ol class="timeline">${stops.map(stopHTML).join("")}</ol>`
      : `<div class="empty box">${GROUPS[curGroup].name}這天還沒出發，${GROUPS[curGroup].startNote}</div>`}`;
  if (animate){
    panel.classList.remove("boing"); void panel.offsetWidth; panel.classList.add("boing");
    panel.querySelectorAll(".stop").forEach((el,i)=>el.style.animationDelay=(0.05*i+0.08)+"s");
  }
}

$("#tabs").addEventListener("click",e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  selectDay(+b.dataset.i, true);
});
$("#tabs").addEventListener("keydown",e=>{
  if(!["ArrowRight","ArrowLeft"].includes(e.key)) return;
  e.preventDefault();
  const n = (curDay + (e.key==="ArrowRight"?1:-1) + DAYS.length) % DAYS.length;
  selectDay(n, true); $("#tab"+n).focus();
});
$("#daypanel").addEventListener("click",e=>{
  const b = e.target.closest(".plan"); if(!b) return;
  curPlan = b.dataset.plan; renderDay(true);
});
function selectDay(i, animate){
  if (i===curDay && animate) return;
  curDay = i; renderTabs(); renderDay(animate);
  $("#tab"+i).scrollIntoView({block:"nearest",inline:"center",behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}

/* 旅行期間自動跳到當天 */
(function(){
  const now = new Date();
  const fmt = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric"}).formatToParts(now);
  const md = fmt.find(p=>p.type==="month").value + "/" + fmt.find(p=>p.type==="day").value;
  const idx = DAYS.findIndex(d=>d.d===md);
  if (idx>=0) curDay = idx;
})();
renderTabs(); renderDay(false);

/* 待辦（勾選狀態保留在這次開啟的頁面中） */
const done = new Set();
$("#todolist").innerHTML = TODOS.map(([t,s],i)=>`
  <li><label><input type="checkbox" data-i="${i}"><span class="check">${ICONS.tick}</span>
  <span class="txt">${esc(t)}${s?`<small>${esc(s)}</small>`:""}</span></label></li>`).join("");
function updateProg(){
  $("#prog").textContent = `${done.size} / ${TODOS.length}`;
  $("#bar").style.width = (done.size/TODOS.length*100)+"%";
}
$("#todolist").addEventListener("change",e=>{
  const i = +e.target.dataset.i; e.target.checked ? done.add(i) : done.delete(i); updateProg();
});
updateProg();

/* 注意事項 */
$("#notes-list").innerHTML = NOTES.map(n=>`
  <article class="note box">
    <h3><span aria-hidden="true">${n.icon||"📌"}</span>${esc(n.title)}</h3>
    <p>${esc(n.text)}</p>
    ${n.img?`<button class="note-img" data-src="${esc(n.img)}" aria-label="放大圖片：${esc(n.caption||n.title)}"><img src="${esc(n.img)}" alt="${esc(n.caption||n.title)}" loading="lazy"></button>${n.caption?`<small>${esc(n.caption)}</small>`:""}`:""}
  </article>`).join("");
const lb = $("#lightbox");
document.addEventListener("click",e=>{
  const b = e.target.closest(".note-img");
  if (b){ lb.querySelector("img").src = b.dataset.src; lb.hidden = false; return; }
  if (!lb.hidden && (e.target===lb || e.target.closest(".lb-close"))) lb.hidden = true;
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") lb.hidden = true; });

/* 住宿 */
$("#stays").innerHTML = STAYS.map(s=>`
  <article class="stay box">${ICONS.house(s.color)}
    <div><h3>${esc(s.area)}</h3><p>${esc(s.name)}・${s.dates}</p>
    ${s.addr?`<p>${esc(s.addr)}</p>`:""}
    <div class="nights">${s.nights.map(n=>`<span class="chip">${n} 晚</span>`).join("")}</div>
    <p>${esc(s.note)}</p>
    ${s.q?`<a class="maplink" href="${NAVER(s.q)}" target="_blank" rel="noopener">${PIN}Naver 地圖</a>`:""}</div>
  </article>`).join("");

/* 倒數 */
function tick(){
  const now = Date.now();
  const g = curGroup==="all" ? null : GROUPS[curGroup];
  const start = Date.parse(g ? g.start : GROUPS.g1.start), end = Date.parse(g ? g.end : GROUPS.g2.end);
  const who = g ? g.name : "第一組";
  let diff = Math.max(0, start - now);
  const d = Math.floor(diff/864e5), h = Math.floor(diff%864e5/36e5), m = Math.floor(diff%36e5/6e4);
  $("#cd-d").textContent = d; $("#cd-h").textContent = h; $("#cd-m").textContent = m;
  $("#cd-msg").textContent = now < start ? `${who}距離出發還有（${g ? g.startNote : GROUPS.g1.startNote}）`
    : now <= end ? "旅行進行中，好好玩！" : "旅行結束了，下次見，釜山";
}
tick(); setInterval(tick, 30000);

/* 組別切換 */
function renderGroupSel(){
  const html = `<span class="gsel-lab">看誰的行程</span>${[["all","全部"],["g1","第一組"],["g2","第二組"]].map(([k,n])=>
    `<button class="gbtn" data-g="${k}" aria-pressed="${k===curGroup}">${n}</button>`).join("")}`;
  document.querySelectorAll(".gsel").forEach(el=>el.innerHTML = html);
}
document.addEventListener("click",e=>{
  const b = e.target.closest(".gbtn"); if(!b) return;
  curGroup = b.dataset.g; renderGroupSel(); renderFlights(); renderDay(true); tick();
});
renderGroupSel(); renderFlights();

/* 選單高亮 */
const links = [...document.querySelectorAll(".nav a[data-sec]")];
const io = new IntersectionObserver(es=>{
  es.forEach(en=>{ if(en.isIntersecting){
    links.forEach(a=>a.classList.toggle("on", a.dataset.sec===en.target.id));
  }});
},{rootMargin:"-45% 0px -50% 0px"});
document.querySelectorAll("main section").forEach(s=>io.observe(s));
links[0].classList.add("on");
</script>
</body>
</html>
